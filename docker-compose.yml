name: DSIN

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-DSIN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DSIN}
      POSTGRES_DB: ${POSTGRES_DB:-DSIN}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6381}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8026}:8025' # interface web
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025' # SMTP

volumes:
  postgres-data:
